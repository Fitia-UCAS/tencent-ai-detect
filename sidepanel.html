<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tencent AI Detect</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #0868f2;
      --brand-hover: #005bdc;
      --brand-soft: #eef5ff;
      --ink: #14213a;
      --muted: #697386;
      --line: #e7ecf3;
      --surface-soft: #f6f8fb;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 280px;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow-x: hidden;
      background: var(--white);
      color: var(--ink);
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    .app {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      isolation: isolate;
    }

    .app::before {
      position: absolute;
      z-index: -1;
      top: -170px;
      left: 50%;
      width: 430px;
      height: 430px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(8, 104, 242, 0.12), rgba(8, 104, 242, 0) 67%);
      content: "";
      transform: translateX(-50%);
      pointer-events: none;
    }

    .brandbar {
      display: flex;
      align-items: center;
      min-height: 64px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(231, 236, 243, 0.92);
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
    }

    .brandbar img {
      width: 34px;
      height: 34px;
      margin-right: 10px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .hero {
      display: grid;
      flex: 1 1 auto;
      min-height: 220px;
      place-items: center;
      padding: 36px 24px 28px;
    }

    .emblem {
      position: relative;
      display: grid;
      width: 118px;
      height: 118px;
      place-items: center;
      border: 1px solid rgba(8, 104, 242, 0.1);
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow:
        0 22px 60px rgba(20, 56, 112, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .emblem::before,
    .emblem::after {
      position: absolute;
      border-radius: inherit;
      content: "";
      pointer-events: none;
    }

    .emblem::before {
      inset: -10px;
      z-index: -1;
      background: rgba(8, 104, 242, 0.055);
    }

    .emblem::after {
      inset: 8px;
      border: 1px solid rgba(255, 255, 255, 0.88);
    }

    .emblem img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    .dock-wrap {
      position: sticky;
      bottom: 0;
      padding: 0 14px 14px;
    }

    .dock {
      padding: 12px;
      border: 1px solid rgba(219, 226, 236, 0.94);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 16px 44px rgba(22, 43, 78, 0.13);
      backdrop-filter: blur(18px);
    }

    .primary {
      display: flex;
      width: 100%;
      min-height: 48px;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 0 18px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #0878ff 0%, var(--brand) 72%);
      box-shadow: 0 9px 22px rgba(8, 104, 242, 0.22);
      color: var(--white);
      cursor: pointer;
      font-size: 14px;
      font-weight: 650;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .primary:hover {
      background: linear-gradient(135deg, #0878ff 0%, var(--brand-hover) 72%);
      box-shadow: 0 11px 25px rgba(8, 104, 242, 0.26);
      transform: translateY(-1px);
    }

    .primary:active {
      box-shadow: 0 6px 16px rgba(8, 104, 242, 0.2);
      transform: translateY(0);
    }

    .primary svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .utility {
      display: flex;
      min-height: 46px;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      padding: 0 5px 0 8px;
    }

    .refresh-control {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-size: 13px;
    }

    .switch {
      position: relative;
      width: 36px;
      height: 20px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: #cbd3df;
      cursor: pointer;
      transition: background 140ms ease;
    }

    .switch::after {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--white);
      box-shadow: 0 1px 4px rgba(19, 32, 55, 0.24);
      content: "";
      transition: transform 140ms ease;
    }

    .switch.active {
      background: var(--brand);
    }

    .switch.active::after {
      transform: translateX(16px);
    }

    .secondary {
      min-height: 34px;
      padding: 0 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      transition: background 140ms ease, color 140ms ease;
    }

    .secondary:hover {
      background: var(--surface-soft);
      color: var(--ink);
    }

    .secondary:disabled {
      cursor: default;
      opacity: 0.5;
    }

    .toast {
      position: fixed;
      z-index: 10;
      right: 22px;
      bottom: 132px;
      left: 22px;
      padding: 10px 12px;
      border: 1px solid rgba(8, 104, 242, 0.12);
      border-radius: 10px;
      background: rgba(238, 245, 255, 0.96);
      box-shadow: 0 9px 26px rgba(20, 47, 88, 0.1);
      color: #24558f;
      font-size: 12px;
      line-height: 1.45;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    button:focus-visible {
      outline: 2px solid rgba(8, 104, 242, 0.38);
      outline-offset: 2px;
    }

    @media (max-height: 460px) {
      .hero {
        min-height: 160px;
        padding-block: 24px;
      }

      .emblem {
        width: 96px;
        height: 96px;
        border-radius: 28px;
      }

      .emblem img {
        width: 60px;
        height: 60px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="brandbar">
      <img src="icon.png" alt="">
      <h1>Tencent AI Detect</h1>
    </header>

    <main class="hero">
      <div class="emblem" aria-hidden="true">
        <img src="icon.png" alt="">
      </div>
    </main>

    <div class="dock-wrap">
      <section class="dock" aria-label="Tencent AI Detect">
        <button id="open-site" class="primary" type="button">
          <span>Open detection page</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M14 7l5 5-5 5"></path>
          </svg>
        </button>

        <div class="utility">
          <div class="refresh-control">
            <span>Relay</span>
            <button id="toggle-relay" class="switch active" type="button" role="switch" aria-checked="true" aria-label="Relay"></button>
          </div>
        </div>

        <div class="utility">
          <div class="refresh-control">
            <span>Auto refresh</span>
            <button id="toggle-refresh" class="switch active" type="button" role="switch" aria-checked="true" aria-label="Auto refresh"></button>
          </div>
          <button id="reset-usage" class="secondary" type="button">Reset count</button>
        </div>
      </section>
    </div>

    <div id="notice" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
