<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tencent AI Detect</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="brandbar">
      <img src="../../icon.png" alt="">
      <h1>Tencent AI Detect</h1>
      <!-- The way into the detection page belongs in the corner, as a link, not as the panel's widest
           button. Opening the page is not what this panel is for - choosing what happens on it is. -->
      <a id="open-site" class="brand-link" href="https://matrix.tencent.com/ai-detect/"
         target="_blank" rel="noopener" aria-label="Open detection page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 4h6v6"></path>
          <path d="M20 4l-8.5 8.5"></path>
          <path d="M18 14v5a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V7.5A1.5 1.5 0 0 1 5 6h5"></path>
        </svg>
      </a>
    </header>

    <main class="hero">
      <div class="emblem" aria-hidden="true">
        <img src="../../icon.png" alt="">
      </div>
    </main>

    <div class="dock-wrap">
      <section class="dock" aria-label="Tencent AI Detect">
        <!-- Shown only when the native host failed to start. Without it a missing registration is
             indistinguishable from a healthy idle extension: nothing happens and nothing says why. -->
        <div id="host-alert" class="host-alert" role="alert" hidden>
          <strong>Local relay host is not registered</strong>
          <span id="host-alert-detail" class="host-alert-detail"></span>
          <code>npm run host:register</code>
        </div>

        <div class="section-label">
          <span>When used up</span>
        </div>

        <!-- Four answers, each its own bordered card with a 3px left edge that turns accent when
             chosen. The server allows five detections per address, so the only choice is when to
             swap; the answers differ in what they cost - waiting keeps the result readable, going now
             keeps a run moving. Only the wait card opens, because it is the only one with a setting. -->
        <div id="spent-modes" class="spent-modes" role="radiogroup" aria-label="What to do when the address is used up">
          <div class="spent-card" data-mode="manual" data-selected="true">
            <div class="spent-head">
              <span class="spent-body">
                <strong>Wait for me</strong>
                <em>The result stays on screen</em>
              </span>
              <span class="spent-tools">
                <button id="rotate-now" class="card-action" type="button"
                        aria-label="Swap the address now">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                       stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 9a8 8 0 0 1 13.5-3.5L20 8"></path>
                    <path d="M20 4v4h-4"></path>
                    <path d="M20 15a8 8 0 0 1-13.5 3.5L4 16"></path>
                    <path d="M4 20v-4h4"></path>
                  </svg>
                </button>
              </span>
            </div>
          </div>

          <div class="spent-card" data-mode="press">
            <div class="spent-head">
              <span class="spent-body">
                <strong>Swap when I press detect</strong>
                <em>The unservable press becomes the request</em>
              </span>
            </div>
          </div>

          <details class="spent-card" data-mode="delay">
            <summary class="spent-head">
              <span class="spent-body">
                <strong>Wait, then swap</strong>
                <em id="spent-delay-hint">Swaps after 30s</em>
              </span>
            </summary>
            <div class="spent-body-panel">
              <label for="spent-delay">Wait</label>
              <input id="spent-delay" class="spent-delay" type="number" min="0.5" max="3600" step="0.5" value="30">
              <span class="unit">seconds, then swap</span>
            </div>
          </details>

          <div class="spent-card" data-mode="immediate">
            <div class="spent-head">
              <span class="spent-body">
                <strong>Swap now</strong>
                <em>Reloads as soon as the allowance is gone</em>
              </span>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
