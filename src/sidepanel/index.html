<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tencent AI Detect</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="brandbar">
      <img src="../../icon.png" alt="">
      <h1>Tencent AI Detect</h1>
    </header>

    <main class="hero">
      <div class="emblem" aria-hidden="true">
        <img src="../../icon.png" alt="">
      </div>
    </main>

    <div class="dock-wrap">
      <section class="dock" aria-label="Tencent AI Detect">
        <!-- Shown only when the native host failed to start. Without it a missing registration is
             indistinguishable from a healthy idle extension: nothing happens and nothing says why. -->
        <div id="host-alert" class="host-alert" role="alert" hidden>
          <strong>Local relay host is not registered</strong>
          <span id="host-alert-detail" class="host-alert-detail"></span>
          <code>npm run host:register</code>
        </div>

        <button id="open-site" class="primary" type="button">
          <span>Open detection page</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M14 7l5 5-5 5"></path>
          </svg>
        </button>

        <div class="utility">
          <div class="refresh-control">
            <span>Page state</span>
            <span id="page-state" class="state-value" data-state="waiting">Waiting…</span>
          </div>
        </div>

        <div class="utility">
          <div class="refresh-control">
            <span>Relay</span>
            <button id="toggle-relay" class="switch active" type="button" role="switch" aria-checked="true" aria-label="Relay"></button>
          </div>
        </div>

        <div class="utility">
          <div class="refresh-control">
            <span>Auto refresh</span>
            <button id="toggle-refresh" class="switch active" type="button" role="switch" aria-checked="true" aria-label="Auto refresh"></button>
          </div>
          <button id="reset-usage" class="secondary" type="button">Reset count</button>
        </div>

        <!-- What happens once this address has served its five detections. The server caps that per
             address, so the choice is only about when to swap addresses - and the answers cost
             different things: waiting keeps the result readable, going now keeps a run moving. -->
        <div class="utility">
          <div class="refresh-control">
            <span>When used up</span>
            <select id="spent-mode" class="spent-mode" aria-label="What to do when the address is used up">
              <option value="manual">Wait for me</option>
              <option value="press">Swap when I press detect</option>
              <option value="delay">Wait, then swap</option>
              <option value="immediate">Swap now</option>
            </select>
          </div>
          <button id="rotate-now" class="secondary" type="button" disabled>Swap address</button>
        </div>

        <!-- Only meaningful on "Wait, then swap". Hidden otherwise so the panel does not present a
             number that has no effect. -->
        <div class="utility" id="spent-delay-row" hidden>
          <div class="refresh-control">
            <span>Wait before swap</span>
            <input id="spent-delay" class="spent-delay" type="number" min="1" max="3600" step="1" value="30"
                   aria-label="Seconds to wait before swapping the address">
            <span class="unit">s</span>
          </div>
        </div>
      </section>
    </div>

    <div id="notice" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="index.js"></script>
</body>
</html>
