name: release

# Publishing is driven by the version in manifest.json, not by a tag someone remembers to push.
# A tag pushed by hand and a version bumped in the manifest are two places to keep in step, and when
# they drift the download says one number and the browser shows another. Here the manifest is the
# single source: bump it, push, and the tag follows.
#
# Re-running is allowed in exactly one case, and refusing the rest is the point. If only files that
# are not in the archive changed - a README, a test - the artifact is identical, so replacing it
# carries no risk and saves a version number for a wording change. If anything the archive contains
# changed, the version must be bumped: the browser compares version numbers to decide whether to
# update, so shipping new code under an old number means the people who already installed it are
# never offered the fix, while a fresh download quietly gets it.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Read the version from the manifest
        id: version
        run: |
          set -euo pipefail

          manifest="$(node -p "require('./manifest.json').version")"
          packaged="$(node -p "require('./package.json').version")"

          # Two files carrying one number is the drift this workflow exists to avoid, so a mismatch
          # stops before anything is published rather than shipping the wrong one.
          if [ "$manifest" != "$packaged" ]; then
            echo "manifest.json says $manifest and package.json says $packaged" >&2
            exit 1
          fi

          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          echo "tag=v$manifest" >> "$GITHUB_OUTPUT"

      - name: Check the tree before it is published
        run: |
          set -euo pipefail
          node tools/regression.cjs
          npm run --silent style:check

      - name: Build the archive
        run: |
          set -euo pipefail
          node scripts/pack-release.cjs --out "dist/tencent-ai-detect-${{ steps.version.outputs.version }}.zip"

      - name: Verify the archive is loadable
        run: |
          set -euo pipefail
          # The module check uses vm.SourceTextModule, which the flag exposes. Without it a content
          # script's syntax errors would go unreported here and surface in the user's browser instead.
          node --experimental-vm-modules scripts/verify-release.cjs \
            "dist/tencent-ai-detect-${{ steps.version.outputs.version }}.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          archive="dist/tencent-ai-detect-${VERSION}.zip"

          # Everything the archive carries and nothing else. A path absent from this list cannot
          # change the download, which is what makes replacing an existing asset safe for the paths
          # that are on it. scripts/ and tests/ are deliberately out: they build and check the
          # archive but are not part of it.
          SHIPPED="manifest.json icon.png src host"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"

            if ! git rev-parse -q --verify "refs/tags/${TAG}^{}" >/dev/null; then
              # The checkout fetches no tags when the workflow is started by hand from a tag that is
              # not reachable from main; asking for it is cheaper than failing.
              git fetch --quiet --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
            fi

            published="$(git rev-parse "refs/tags/${TAG}^{}" 2>/dev/null || true)"
            if [ -z "$published" ]; then
              echo "cannot resolve $TAG to a commit, so the replacement would be unverified" >&2
              exit 1
            fi

            if ! git diff --quiet "$published" HEAD -- $SHIPPED; then
              echo "the code shipped in $TAG has changed since it was published:" >&2
              git diff --stat "$published" HEAD -- $SHIPPED >&2
              echo "" >&2
              echo "the browser compares version numbers, so new code under an old number reaches new" >&2
              echo "downloads only - anyone who already installed it is never offered the update." >&2
              echo "bump the version in manifest.json and package.json." >&2
              exit 1
            fi

            echo "nothing in the archive changed since $published; replacing the asset"
            gh release upload "$TAG" "$archive" --clobber
            echo "replaced https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            exit 0
          fi

          # Notes are generated from the commits since the previous tag, so the release says what
          # changed without a hand-written file that falls behind.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --generate-notes \
            --notes "Zhuque Detect Assistant v${VERSION}. Unzip it and load it as an unpacked extension in Edge; see the README." \
            "$archive"

          echo "published https://github.com/${{ github.repository }}/releases/tag/${TAG}"
